name: weekly-refresh
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate dataset from the public API
        run: node refresh.mjs
      - name: Commit if changed
        run: |
          git config user.name "dataset-refresh[bot]"
          git config user.email "dataset-refresh@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: weekly refresh $(date -u +%F)"
          git push
